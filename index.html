<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Mood Tracker"/>
<title>My Mood Tracker</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0b1120;color:#e2e8f0;min-height:100vh}
body{background:linear-gradient(160deg,#0b1120 0%,#0f1e3d 60%,#101820 100%)}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:14px 16px;background:rgba(10,20,50,0.95);position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(255,255,255,0.08)}
.logo{font-weight:900;font-size:18px;color:#60A5FA}
.logo span{color:#FBBF24}
nav{display:flex;gap:6px}
button.nb{padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:#94a3b8;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
button.nb.on{background:#1e3a6e;border-color:#3B82F6;color:#60A5FA}
main{max-width:600px;margin:0 auto;padding:20px 14px 80px}
.pg{display:none}.pg.on{display:block}
h2{font-weight:900;font-size:21px;color:#f1f5f9;margin-bottom:18px}
.db{font-size:11px;font-weight:700;color:#FBBF24;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:4px}
.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.09);border-radius:14px;padding:14px;margin-bottom:12px}
.lbl{font-size:11px;font-weight:700;color:#60A5FA;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
/* mood */
.mr{display:flex;gap:7px;flex-wrap:wrap}
.mb{flex:1 1 50px;min-width:50px;padding:10px 3px;border-radius:11px;border:2px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.07);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;color:#94a3b8;font-size:11px;font-weight:700}
.mb.on{color:#0f172a}
.mej{font-size:24px;line-height:1;display:block}
/* ticks */
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:7px}
.tb{border-radius:11px;border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;color:#cbd5e1;font-size:12px;font-weight:700;position:relative;text-align:center}
.tb.on{background:#FBBF24;border-color:#FBBF24;color:#0f172a}
.tej{font-size:22px;line-height:1;display:block}
.ck{position:absolute;top:4px;right:6px;font-size:12px;font-weight:900;color:#0f172a}
/* note */
textarea{width:100%;min-height:90px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:9px;color:#e2e8f0;font-family:inherit;font-size:15px;padding:10px 12px;resize:vertical;line-height:1.55}
textarea:focus{outline:2px solid #FBBF24;border-color:transparent}
.cc{text-align:right;font-size:12px;color:#475569;margin-top:4px}
.sb{background:rgba(59,130,246,0.14);border:1px solid rgba(59,130,246,0.3);border-radius:11px;padding:11px 14px;font-size:14px;color:#93c5fd;font-weight:600;text-align:center;margin-top:4px;display:none}
/* chart */
.cw{display:flex;align-items:flex-end;gap:5px;height:80px;overflow-x:auto;padding-bottom:2px}
.bc{display:flex;flex-direction:column;align-items:center;gap:3px;flex:0 0 auto;width:26px}
.bf{width:100%;border-radius:3px 3px 0 0;min-height:3px}
.bl{font-size:9px;color:#475569;font-weight:600}
/* history */
.hc{display:flex;flex-direction:column;gap:9px}
.hcard{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.09);border-radius:13px;padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.htop{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.hd{font-weight:700;font-size:14px;color:#cbd5e1}
.mp{border-radius:18px;padding:3px 10px;font-weight:700;font-size:12px;color:#0f172a}
.ht{display:flex;flex-wrap:wrap;gap:5px}
.htk{background:rgba(96,165,250,0.12);border:1px solid rgba(96,165,250,0.2);border-radius:18px;padding:2px 8px;font-size:11px;color:#93c5fd;font-weight:600}
.hn{font-size:12px;color:#94a3b8;line-height:1.55;font-style:italic;border-top:1px solid rgba(255,255,255,0.06);padding-top:7px}
.em{color:#475569;text-align:center;margin-top:40px;font-size:14px}
/* manage */
.ar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.ei{width:46px;text-align:center;font-size:19px;padding:8px 3px;border-radius:9px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#e2e8f0;font-family:inherit}
.li{flex:1;min-width:130px;padding:8px 11px;border-radius:9px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#e2e8f0;font-family:inherit;font-size:14px}
.ei:focus,.li:focus{outline:2px solid #FBBF24}
.abtn{padding:8px 16px;border-radius:9px;border:none;background:#FBBF24;color:#0f172a;font-family:inherit;font-weight:900;font-size:14px;cursor:pointer}
.ml2{display:flex;flex-direction:column;gap:7px}
.mr2{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,0.04);border-radius:9px;border:1px solid rgba(255,255,255,0.07)}
.me3{font-size:19px}.ml3{flex:1;color:#e2e8f0;font-weight:600;font-size:13px}
.rb{background:rgba(239,68,68,0.14);border:1px solid rgba(239,68,68,0.2);color:#f87171;border-radius:7px;padding:3px 9px;font-weight:700;cursor:pointer;font-family:inherit;font-size:12px}
.mdesc{color:#475569;font-size:13px;margin-bottom:16px}

.tellmum{display:block;width:100%;margin-top:10px;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#3B82F6,#1e3a6e);color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:0.3px}
.tellmum:active{opacity:0.85}
</style>
</head>
<body>
<header>
  <div class="logo">⚡ My <span>Mood Tracker</span></div>
  <nav>
    <button class="nb on" onclick="showPage('today',this)">Today</button>
    <button class="nb" onclick="showPage('history',this)">History</button>
    <button class="nb" onclick="showPage('manage',this)">My List</button>
  </nav>
</header>
<main>

<div id="today" class="pg on">
  <h2><span class="db" id="datelbl"></span>How's today going?</h2>
  <div class="card">
    <div class="lbl">⚡ Overall mood</div>
    <div class="mr" id="moodrow"></div>
  </div>
  <div class="card">
    <div class="lbl">☑ Tick everything that fits today</div>
    <div class="tg" id="tickgrid"></div>
  </div>
  <div class="card">
    <div class="lbl">📝 Anything else to add?</div>
    <textarea id="noteinput" maxlength="600" placeholder="Write anything — a thought, what happened, how your body feels..."></textarea>
    <div class="cc"><span id="charcount">0</span>/600</div>
  </div>
  <div class="sb" id="savebanner"></div>
  <button class="tellmum" onclick="tellMum()">📧 Tell Mum how I'm feeling</button>

</div>

<div id="history" class="pg">
  <h2>History</h2>
  <div id="histcontent"></div>
</div>

<div id="manage" class="pg">
  <h2>My Feelings &amp; Symptoms List</h2>
  <p class="mdesc">Add your own feelings or symptoms so the checklist is just right for you.</p>
  <div class="card">
    <div class="lbl">➕ Add something new</div>
    <div class="ar">
      <input class="ei" id="newemoji" maxlength="2" value="✏️"/>
      <input class="li" id="newlabel" maxlength="30" placeholder="e.g. Can't concentrate"/>
      <button class="abtn" onclick="addItem()">Add</button>
    </div>
  </div>
  <div class="card">
    <div class="lbl">📋 Current list</div>
    <div class="ml2" id="managelist"></div>
  </div>
</div>

</main>

<script>
// ---- data ----
var ITEMS_KEY = "mt2_items";
var LOG_KEY   = "mt2_log";

var DEFAULT_ITEMS = [
  {id:"headache", label:"Headache",     emoji:"🤕"},
  {id:"tired",    label:"Tired",        emoji:"😴"},
  {id:"tummy",    label:"Tummy ache",   emoji:"🤢"},
  {id:"happy",    label:"Happy",        emoji:"😄"},
  {id:"sad",      label:"Sad",          emoji:"😢"},
  {id:"angry",    label:"Angry",        emoji:"😤"},
  {id:"worried",  label:"Worried",      emoji:"😟"},
  {id:"excited",  label:"Excited",      emoji:"🤩"},
  {id:"lonely",   label:"Lonely",       emoji:"🙁"},
  {id:"hungry",   label:"Extra hungry", emoji:"🍕"},
  {id:"energetic",label:"Energetic",    emoji:"⚡"},
  {id:"calm",     label:"Calm",         emoji:"😌"}
];

var MOODS = [
  {v:1, label:"Rough",   e:"😣", c:"#3B82F6"},
  {v:2, label:"Meh",     e:"😕", c:"#60A5FA"},
  {v:3, label:"OK",      e:"😐", c:"#FBBF24"},
  {v:4, label:"Good",    e:"🙂", c:"#F59E0B"},
  {v:5, label:"Awesome", e:"😄", c:"#EAB308"}
];

// safe storage wrapper - falls back to in-memory if localStorage blocked
var MEM = {};
function sget(k, fb) {
  try {
    var v = localStorage.getItem(k);
    return v !== null ? JSON.parse(v) : (MEM[k] !== undefined ? MEM[k] : fb);
  } catch(e) {
    return MEM[k] !== undefined ? MEM[k] : fb;
  }
}
function sset(k, v) {
  MEM[k] = v;
  try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {}
}

var items = sget(ITEMS_KEY, DEFAULT_ITEMS);
var log   = sget(LOG_KEY, {});

function todayKey() {
  var d = new Date();
  var mm = d.getMonth()+1; var dd = d.getDate();
  return d.getFullYear()+"-"+(mm<10?"0"+mm:mm)+"-"+(dd<10?"0"+dd:dd);
}
function fmtDate(s) {
  var p = s.split("-");
  return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
}

var TODAY = todayKey();
document.getElementById("datelbl").textContent = fmtDate(TODAY);

function getToday() { return log[TODAY] || {mood:0, ticked:[], note:""}; }
function patchToday(obj) {
  var cur = getToday();
  for (var k in obj) cur[k] = obj[k];
  log[TODAY] = cur;
  sset(LOG_KEY, log);
  renderBanner();
}

// ---- nav ----
function showPage(id, btn) {
  var pages = document.querySelectorAll(".pg");
  for (var i=0; i<pages.length; i++) pages[i].classList.remove("on");
  var btns = document.querySelectorAll(".nb");
  for (var i=0; i<btns.length; i++) btns[i].classList.remove("on");
  document.getElementById(id).classList.add("on");
  if (btn) btn.classList.add("on");
  if (id === "history") renderHistory();
  if (id === "manage")  renderManage();
}

// ---- mood ----
function renderMoods() {
  var row = document.getElementById("moodrow");
  row.innerHTML = "";
  var cur = getToday().mood;
  for (var i=0; i<MOODS.length; i++) {
    (function(m){
      var btn = document.createElement("button");
      btn.className = "mb" + (cur===m.v ? " on" : "");
      btn.style.background  = cur===m.v ? m.c : "rgba(255,255,255,0.07)";
      btn.style.borderColor = cur===m.v ? m.c : "rgba(255,255,255,0.12)";
      btn.style.boxShadow   = cur===m.v ? "0 0 14px "+m.c+"99" : "none";
      btn.style.color       = cur===m.v ? "#0f172a" : "#94a3b8";
      btn.innerHTML = '<span class="mej">'+m.e+'</span><span>'+m.label+"</span>";
      btn.onclick = function(){ patchToday({mood:m.v}); renderMoods(); };
      row.appendChild(btn);
    })(MOODS[i]);
  }
}

// ---- ticks ----
function renderTicks() {
  var grid = document.getElementById("tickgrid");
  grid.innerHTML = "";
  var ticked = getToday().ticked;
  for (var i=0; i<items.length; i++) {
    (function(item){
      var on = ticked.indexOf(item.id) > -1;
      var btn = document.createElement("button");
      btn.className = "tb" + (on ? " on" : "");
      btn.innerHTML = '<span class="tej">'+item.emoji+'</span><span>'+item.label+"</span>"+(on?'<span class="ck">✓</span>':"");
      btn.onclick = function(){
        var t = getToday().ticked.slice();
        var idx = t.indexOf(item.id);
        if (idx > -1) t.splice(idx,1); else t.push(item.id);
        patchToday({ticked:t});
        renderTicks();
      };
      grid.appendChild(btn);
    })(items[i]);
  }
}

// ---- banner ----
function renderBanner() {
  var d = getToday();
  var b = document.getElementById("savebanner");
  if (d.mood || d.ticked.length > 0) {
    b.style.display = "block";
    b.textContent = "✅ Saved! Logged "+d.ticked.length+" thing"+(d.ticked.length!==1?"s":"")+" today.";
  } else {
    b.style.display = "none";
  }
}

// ---- note ----
var ni = document.getElementById("noteinput");
var cc = document.getElementById("charcount");
ni.value = getToday().note || "";
cc.textContent = ni.value.length;
ni.oninput = function(){ cc.textContent = ni.value.length; patchToday({note:ni.value}); };

// ---- history ----
function renderHistory() {
  var el = document.getElementById("histcontent");
  el.innerHTML = "";
  var days = [];
  for (var k in log) {
    var v = log[k];
    if (v.mood || (v.ticked && v.ticked.length) || v.note) days.push(k);
  }
  days.sort().reverse();
  if (!days.length) { el.innerHTML = '<p class="em">No entries yet — start on Today!</p>'; return; }

  // chart
  var sec = document.createElement("div"); sec.className = "card";
  sec.innerHTML = '<div class="lbl">📊 Mood over time</div>';
  var wrap = document.createElement("div"); wrap.className = "cw";
  var recent = days.slice(0,14).slice().reverse();
  for (var i=0; i<recent.length; i++) {
    var date = recent[i]; var data = log[date];
    var m = null;
    for (var j=0; j<MOODS.length; j++) if (MOODS[j].v === data.mood) { m=MOODS[j]; break; }
    var h = data.mood ? data.mood*15 : 3;
    var col = document.createElement("div"); col.className = "bc";
    var fill = document.createElement("div"); fill.className = "bf";
    fill.style.height = h+"px"; fill.style.background = m ? m.c : "#334155";
    var lbl = document.createElement("span"); lbl.className = "bl";
    lbl.textContent = +date.split("-")[2];
    col.appendChild(fill); col.appendChild(lbl); wrap.appendChild(col);
  }
  sec.appendChild(wrap); el.appendChild(sec);

  // cards
  var cards = document.createElement("div"); cards.className = "hc";
  for (var i=0; i<days.length; i++) {
    var date = days[i]; var data = log[date];
    var m = null;
    for (var j=0; j<MOODS.length; j++) if (MOODS[j].v === data.mood) { m=MOODS[j]; break; }
    var tItems = [];
    if (data.ticked) {
      for (var j=0; j<data.ticked.length; j++) {
        for (var jj=0; jj<items.length; jj++) if (items[jj].id===data.ticked[j]) { tItems.push(items[jj]); break; }
      }
    }
    var card = document.createElement("div"); card.className = "hcard";
    var top = document.createElement("div"); top.className = "htop";
    var ds = document.createElement("span"); ds.className = "hd"; ds.textContent = fmtDate(date);
    top.appendChild(ds);
    if (m) { var pill=document.createElement("span"); pill.className="mp"; pill.style.background=m.c; pill.textContent=m.e+" "+m.label; top.appendChild(pill); }
    card.appendChild(top);
    if (tItems.length) {
      var th = document.createElement("div"); th.className = "ht";
      for (var j=0; j<tItems.length; j++) { var s=document.createElement("span"); s.className="htk"; s.textContent=tItems[j].emoji+" "+tItems[j].label; th.appendChild(s); }
      card.appendChild(th);
    }
    if (data.note) { var np=document.createElement("p"); np.className="hn"; np.textContent=data.note; card.appendChild(np); }
    cards.appendChild(card);
  }
  el.appendChild(cards);
}

// ---- manage ----
function renderManage() {
  var list = document.getElementById("managelist");
  list.innerHTML = "";
  for (var i=0; i<items.length; i++) {
    (function(item){
      var row = document.createElement("div"); row.className = "mr2";
      var e = document.createElement("span"); e.className="me3"; e.textContent=item.emoji;
      var l = document.createElement("span"); l.className="ml3"; l.textContent=item.label;
      var rb = document.createElement("button"); rb.className="rb"; rb.textContent="✕";
      rb.onclick = function(){
        var next = [];
        for (var j=0; j<items.length; j++) if (items[j].id!==item.id) next.push(items[j]);
        items = next; sset(ITEMS_KEY,items); renderManage(); renderTicks();
      };
      row.appendChild(e); row.appendChild(l); row.appendChild(rb); list.appendChild(row);
    })(items[i]);
  }
}

function addItem() {
  var label = document.getElementById("newlabel").value.trim();
  var emoji = document.getElementById("newemoji").value.trim() || "✏️";
  if (!label) return;
  items.push({id:"c"+Date.now(), label:label, emoji:emoji});
  sset(ITEMS_KEY, items);
  document.getElementById("newlabel").value = "";
  document.getElementById("newemoji").value = "✏️";
  renderManage(); renderTicks();
}

document.getElementById("newlabel").onkeydown = function(e){ if(e.key==="Enter") addItem(); };


// ---- tell mum ----
function tellMum() {
  var d = getToday();
  var moodLabel = "Not set";
  for (var i=0; i<MOODS.length; i++) {
    if (MOODS[i].v === d.mood) { moodLabel = MOODS[i].e + " " + MOODS[i].label; break; }
  }
  var tickLabels = [];
  if (d.ticked) {
    for (var i=0; i<d.ticked.length; i++) {
      for (var j=0; j<items.length; j++) {
        if (items[j].id === d.ticked[i]) { tickLabels.push(items[j].emoji + " " + items[j].label); break; }
      }
    }
  }
  var today = fmtDate(TODAY);
  var subject = encodeURIComponent("My mood today — " + today);
  var body = "Hi Mum,\n\n";
  body += "Here is how I am feeling today (" + today + "):\n\n";
  body += "Overall mood: " + moodLabel + "\n";
  if (tickLabels.length) {
    body += "\nThings I ticked:\n";
    for (var i=0; i<tickLabels.length; i++) body += "  • " + tickLabels[i] + "\n";
  }
  if (d.note) body += "\nExtra note:\n" + d.note + "\n";
  body += "\nLove you ♥";
  window.location.href = "mailto:Em08map@outlook.com?subject=" + subject + "&body=" + encodeURIComponent(body);
}

// ---- init ----
renderMoods();
renderTicks();
renderBanner();
</script>
</body>
</html>
